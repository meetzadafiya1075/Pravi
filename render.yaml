services:
  # 1. Government Infrastructure ALM Node.js + Express Web Service
  - type: web
    name: gov-infra-alm-api
    runtime: node
    plan: starter
    buildCommand: "cd backend && npm install && npm run seed"
    startCommand: "cd backend && npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
        # Configure with your MongoDB Atlas connection string:
        # mongodb+srv://<username>:<password>@cluster0.mongodb.net/gov_infra?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://gov-infra-alm.vercel.app,http://localhost:3000"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
