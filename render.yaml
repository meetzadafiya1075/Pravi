services:
  # 1. FastAPI Web Service
  - type: web
    name: asset-management-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asset-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: asset-management-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://asset-platform.vercel.app"

  # 2. Background Worker Service (ARQ)
  - type: worker
    name: asset-management-worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && arq app.workers.worker.WorkerSettings"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asset-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: asset-management-redis
          property: connectionString

databases:
  # Managed PostgreSQL
  - name: asset-management-db
    databaseName: asset_management
    user: pravi_user
    plan: standard

  # Managed Redis
  - type: redis
    name: asset-management-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
