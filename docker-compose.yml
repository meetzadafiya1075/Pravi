version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: gov_infra_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov_infra_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/gov_infra
      - JWT_SECRET=super_secure_secret_key_minimum_32_characters_long_1234567890
      - JWT_REFRESH_SECRET=refresh_super_secret_jwt_key_9876543210
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CLOUDINARY_CLOUD_NAME=demo-gov-infra
      - CLOUDINARY_API_KEY=123456789
      - CLOUDINARY_API_SECRET=mock-secret-key
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gov_infra_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
